[package]
name = "arka-accounting"
version = "6.0.0"
description = "ARKA Multi-Currency Exchange & Accounting System"
authors = ["ARKA Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "image-ico"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = false
codegen-units = 1
panic = "abort"
strip = true
debug = false
