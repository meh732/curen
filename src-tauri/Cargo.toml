[package]
name = "tarazban-accounting"
version = "1.0.0"
description = "TarazBan Multi-Currency Accounting System"
authors = ["TarazBan Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = false
codegen-units = 1
panic = "abort"
strip = true
debug = false
